    - cloud service
    # NOT added (mixed real/infra in top hits): internet, network(s), web -> LLM org classifier
  # Unknown big orgs: we could not tell if they are a real company or a hoster/ISP, so we
  # do not trust the org name alone (abstain > guess). EXACT whole-name match, because
  # "ace" as a word match would also hit "Ace Hardware". Reason = unclassified_org.
  # To be replaced by the LLM org classifier + gold set later.
