# exclusions.yaml: WHO is never a prospect (docs/DECISIONS.md D2: exclude first, score later).
# Every row gets exactly one outcome: excluded (with reason) | needs_attribution | eligible.
# All values below were seen in part-00 (logs/config_checks.txt, 2026-11-04) unless marked.
# Org matching = case-insensitive substring/regex on the RAW org string (lowercased).
# Normalization (bottom of file) is only for building account names, not for matching.

# 1) HARD exclude: never scored, even if a cert or hostname names a customer.
#    Why: the open ports belong to the vendor/ISP, not to the customer.
#    Rows are kept aside (not deleted) for the later "competitor install base" signal.
hard_exclude:
  tags: [cdn, honeypot]   # Shodan's own tags. cdn = 226,049 rows; catches 8,980 rows the
                          # org regex misses. honeypot = 8,635 rows (mostly on Aliyun).
  cdn_waf_orgs:           # backup when the tag is missing (80 rows matched regex but had no tag)
    - incapsula
    - cloudflare
    - akamai
    - cdnetworks          # 226 eligible rows before (round 2, top eligible orgs)
    - ddos-guard          # attribute round 2: cert O "ddos-guard" (9)
  cloud_edge_services:    # cloud.service values that are CDN/edge, not a customer server
    - CLOUDFRONT          # 7,147 rows
    - GLOBALACCELERATOR   # 595 rows
  isp_orgs:               # telecoms / transit / residential ISPs from Q4 top orgs.
    - telecom             # Korea Telecom, Deutsche Telekom (see "telekom"), Telecom Italia, ...
    - telekom
    - communications      # Comcast, Charter, Cogent, Cox, AT&T ...
    - cablevision
    - verizon
    - "at&t"
    - china mobile
    - chunghwa
    - "data communication business group"
    - vnpt
    - "vietnam posts"
    - kpn
    - "orange s.a."
    - "ntt america"
    - "so-net"
    # round 2: top orgs still eligible after the first run (name says ISP/telecom)
    - chinanet
    - china unicom
    - viettel
    - claro
    - fastweb
    - proximus
    - wind tre
    - sk broadband
    - telia
    - level 3
    - telefonica
    - telefônica
    - internet rimon
    - wired isp
    # round 4: generic ISP words
    - broadband           # 930 rows / 190 orgs ("Pool for Broadband DSL customers", Aussie Broadband)
    - isp                 # 226 / 76 ("Bluewin is an LIR and ISP in Switzerland")
  # Residential: no residential field exists. Residential IPs sit on ISP orgs, so the
  # isp_orgs list covers them. No separate rule (keep it simple).

# 1b) OPTIONAL exclude: cybersecurity vendors (they sell security; pitching them is odd).
#     Switch on/off here. Matched against the account's org name AND its attributed
#     domain/cert org, so an account is caught however it was attributed.
#     When enabled: false, they are scored like anyone else.
security_vendors:
  enabled: true
  names:                  # seen in part-00 (Q4 org, Q5 domain, cert O)
    - palo alto networks  # org, 617 rows
    - trend micro         # domain trendmicro.com, 255 rows
    - trendmicro
    - cisco               # domain cisco.com 281, cert O "Cisco Systems Inc." 203
    - meraki              # Cisco brand: org Meraki LLC 322, domain meraki.com 224
    - zscaler             # cert O "Zscaler, Inc." 19 (checked on tier-A owner in attribute.py)
    - proofpoint          # cert O "Proofpoint, Inc." 18
    - iboss               # cert O, 6 (attribute round 3)
    - fortinet            # as an OWNER name only; Fortinet default certs are handled
                          # separately in default_cert_orgs (those devices belong to customers)

# 2) SOFT exclude: clouds / big hosting. Scored ONLY if attribution tier A or B succeeds
#    (real cert subject or real customer hostname). The org name alone is never enough.
needs_attribution:
