  use_cloud_provider: true    # cloud.provider is non-null (Google, Amazon, Alibaba Cloud,
                              # Tencent Cloud, DigitalOcean, Azure, Linode, Oracle Cloud...)
  hosting_orgs:               # hosters without the cloud tag, from Q4
    - google
    - amazon
    - aliyun
    - alibaba
    - microsoft
    - tencent
    - huawei
    - scaleway
    - hetzner
    - "fly.io"
    - digitalocean
    - ovh
    - linode
    - contabo
    - hostpapa
    - "peg tech"
    # round 2: hosters still eligible after the first run
    - ionos
    - godaddy
    - hostdime
    - m247
    - sakura internet
    - power line datacenter
    - ctg server
    - international business machines   # isp = IBM Cloud
    # round 4: generic hosting WORDS (word-start match), after attribute.py showed hosters
    # agreeing with their own domains (HostGator, A2 Hosting...). Eligible rows hit in ():
    - hosting             # 853 rows / 190 orgs (InMotion, A2, ZAP-Hosting, Rackspace)
    - host                # 1,595 / 346 (HostGator, Host Europe, HOSTKEY)
    - server              # 613 / 133 (also "servers": Servers.com, Cherry Servers)
    - datacenter          # 118 / 37
    - data center         # 268 / 38 (Ace Data Centers)
