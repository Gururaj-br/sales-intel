default_cert_cns: ["support", "*", "localhost"]

# 5) How attribution picks an owner (pipeline/attribute.py). Tiers: A cert O > B domain > C org.
attribution:
  # A cert O or B domain that names a CDN / hoster / ISP (the lists above) is never an owner:
  # "CloudFlare, Inc." cert or "linode.com" hostname just means "hosted there".
  reject_infra_names: true
  # Reverse-DNS rule: a hostname that contains all 4 parts of its own IPv4
  # (static.152.82.88.23.clients.your-server.de) is a machine name made by a hoster/ISP.
  # part-00: 126,389 of 192,037 hostnames on scorable rows. Replaces an endless ISP domain list.
  reverse_dns_rule: true
  # round 2: ISPs hide the IP in other ways, so a hostname is ALSO reverse-DNS when it has
  # >= 3 of the IP's numbers (compared as numbers: "090" == 90; dsl081-224-136.speakeasy.net),
  # or the IP in hex (ool-2f153e12.static.optonline.net), or one of these whole labels
  # (labels = parts between "." and "-"): customer.chcoilx1.isp.starlink.com
  reverse_dns_words: [static, dynamic, dyn, pool, pools, dsl, adsl, cable, modemcable, cpe,
                      customer, cust, dhcp, broadband, client, clients, ppp, isp, residential]
  # More than one real domain left on one IP+port (shared hosting) -> we cannot tell
  # which site owns the server -> no tier B (abstain > guess).
  abstain_on_multiple_domains: true

# Org string normalization (so "ServiceNow, Inc." == "SERVICENOW, INC.").
org_normalize:
  lowercase: true
  strip_punctuation: true
  strip_suffixes: [inc, llc, ltd, limited, corp, corporation, co, gmbh, plc, sa, sas, ag, bv, pty, pte]
