# pipeline.yaml: HOW to read the raw scan records. No business rules and no folders here
# (where files live is config/orchestrator.yaml).

# Laptop-safe DuckDB limits (default = ~80% RAM, which froze the laptop once).
# The orchestrator overrides memory/threads per worker (process.duckdb_*_per_worker).
duckdb:
  memory_limit: 4GB
  threads: 4
  temp_directory: data/work/duckdb

# DuckDB read_json options. VERIFIED gotchas (see CLAUDE.md).
# ingest.py passes an explicit column list, so DuckDB does NOT guess the schema
# (no sample_size needed) and only the fields we pick are kept. Heavy fields such as
# http.html, tcp.raw and the raw banner text are simply never selected; they stay in bronze.
read_json:
  format: newline_delimited
  maximum_object_size: 33554432 # some records are huge (32 MB cap)
  ignore_errors: true
